# Publishes the site to GitHub Pages on every push to main.
# One-time setup on GitHub: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Only the files the page needs: no workflow files or editor settings
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html styles.css js icon.svg apple-touch-icon.png _site/
      # Phones keep files for up to 10 minutes. Tagging each link with this commit's id
      # makes them fetch the new styles and scripts right after a deploy.
      - name: Version the file links
        run: |
          v=$(echo "$GITHUB_SHA" | cut -c1-8)
          sed -i -E "s#(href=\"styles\.css|src=\"js/[a-z-]+\.js)\"#\1?v=$v\"#g" _site/index.html
          grep -c "?v=$v" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
